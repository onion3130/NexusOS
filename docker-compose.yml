# NexusOS Milestone 4 development stack
#
# API and web are now real identity/persistence/telemetry services. Worker, proxy, and AI remain
# deferred placeholders until their approved milestones. Configure .env first.

services:
  nexus-proxy:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nexus-api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    platform: linux/arm64
    env_file:
      - .env
    environment:
      DATA_DIR: /var/lib/nexus/data
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/nexus/data/nexus.db}
    volumes:
      - "${DATA_DIR:-./data}/db:/var/lib/nexus/data"
      - "${DATA_DIR:-./data}/logs:/var/log/nexus"
    networks:
      - nexus-private
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nexus-web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_PROXY_TARGET: http://nexus-api:8000
    platform: linux/arm64
    environment:
      NODE_ENV: development
    networks:
      - nexus-private
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      nexus-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nexus-worker:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-development}
      TZ: ${TZ:-UTC}
    volumes:
      - "${DATA_DIR:-./data}/backups:/var/lib/nexus/backups"
      - "${DATA_DIR:-./data}/logs:/var/log/nexus"
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional local model boundary. Disabled until a compatible provider is
  # selected and its ARM64 resource budget is validated on the Pi.
  nexus-ai:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    profiles: ["ai-scaffold"]
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      TZ: ${TZ:-UTC}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
    volumes:
      - "${DATA_DIR:-./data}/cache:/var/cache/nexus-ai"
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  nexus-private:
    name: nexus-private
    driver: bridge

# DATA_DIR is the host-side runtime root. On the Pi, point it to the SSD.
