# NexusOS Milestone 1 foundation scaffold
#
# These services are intentionally no-op ARM64 placeholders. They prove the
# network, persistence, naming, and restart topology without generating the
# application prematurely. Replace each placeholder image/command with the
# real service in its approved implementation milestone.

services:
  nexus-proxy:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nexus-api:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-development}
      TZ: ${TZ:-UTC}
      DB_TYPE: ${DB_TYPE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/nexus/data/nexus.db}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
    volumes:
      - "${DATA_DIR:-./data}/db:/var/lib/nexus/data"
      - "${DATA_DIR:-./data}/logs:/var/log/nexus"
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nexus-web:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nexus-worker:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-development}
      TZ: ${TZ:-UTC}
    volumes:
      - "${DATA_DIR:-./data}/backups:/var/lib/nexus/backups"
      - "${DATA_DIR:-./data}/logs:/var/log/nexus"
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional local model boundary. Disabled until a compatible provider is
  # selected and its ARM64 resource budget is validated on the Pi.
  nexus-ai:
    image: alpine:3.20
    platform: linux/arm64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    profiles: ["ai-scaffold"]
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    environment:
      TZ: ${TZ:-UTC}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
    volumes:
      - "${DATA_DIR:-./data}/cache:/var/cache/nexus-ai"
    networks:
      - nexus-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  nexus-private:
    name: nexus-private
    driver: bridge

# The bind-mounted DATA_DIR is intentionally external to the image. On the
# Pi, set DATA_DIR to a directory on the SSD and back it up independently.
